name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
      - name: Validate license verification key
        shell: pwsh
        env:
          QUOTA_FLOAT_LICENSE_PUBLIC_KEY: ${{ secrets.QUOTA_FLOAT_LICENSE_PUBLIC_KEY }}
        run: |
          $encoded = $env:QUOTA_FLOAT_LICENSE_PUBLIC_KEY
          if ([string]::IsNullOrWhiteSpace($encoded)) {
            throw "QUOTA_FLOAT_LICENSE_PUBLIC_KEY is not configured."
          }
          try {
            $key = [Convert]::FromBase64String($encoded.Trim())
          } catch {
            throw "QUOTA_FLOAT_LICENSE_PUBLIC_KEY is not valid Base64."
          }
          if ($key.Length -ne 32) {
            throw "QUOTA_FLOAT_LICENSE_PUBLIC_KEY must decode to exactly 32 bytes."
          }
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          QUOTA_FLOAT_LICENSE_PUBLIC_KEY: ${{ secrets.QUOTA_FLOAT_LICENSE_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Quota Float v__VERSION__
          releaseBody: |
            ## What's new

            - Adds Claude subscription, OpenAI API-cost, and Claude API-cost sources alongside Codex/ChatGPT subscription quota.
            - Displays API spend as an amount with its currency, supports provider switching, and can rotate between connected sources automatically.
            - Distinguishes Codex, Claude, OpenAI API, and Claude API with provider-specific visual treatment.
            - Adds the Glass frosted and Nexus mechanical widget skins.
            - Shows a compact selected-provider metric in the Windows tray icon and an optional macOS menu-bar readout.

            ![Quota Float Glass skin](https://raw.githubusercontent.com/change-42-yhmm/quota-float/main/assets/skin-glass.png)

            ## Privacy

            Quota Float remains local-first: it reads the existing Codex Desktop login state only for quota requests and does not upload prompts, chats, raw quota responses, or local credentials.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
